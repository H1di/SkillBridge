services:
  - type: web
    runtime: python
    name: skillbridge-web
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/meta
    envVars:
      - key: SKILLBRIDGE_DATA_DIR
        value: /var/data
    disk:
      name: skillbridge-data
      mountPath: /var/data
      sizeGB: 1
